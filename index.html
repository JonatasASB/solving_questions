<!DOCTYPE html>
<html lang="pt-BR" data-tema="claro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="titulo_site">Resolução de Questões</title>
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>

  <header class="cabecalho">
    <div class="cabecalho__lado">
      <span class="logo" aria-hidden="true">&lt;/&gt;</span>

      <!-- Controles de tela pequena — PRD 3.3 e 3.7 -->
      <nav class="menus" aria-label="Escolhas">
        <div class="menu">
          <button type="button" class="botao botao--pilula" id="btn-menu-linguagem"
                  aria-haspopup="listbox" aria-expanded="false"
                  data-i18n="linguagem">Linguagem</button>
          <ul class="menu__lista" id="lista-linguagem" role="listbox" hidden></ul>
        </div>
        <div class="menu">
          <button type="button" class="botao botao--pilula" id="btn-menu-nivel"
                  aria-haspopup="listbox" aria-expanded="false"
                  data-i18n="nivel">Nível</button>
          <ul class="menu__lista" id="lista-nivel" role="listbox" hidden></ul>
        </div>
      </nav>
    </div>

    <h1 class="cabecalho__titulo" data-i18n="titulo_site">Resolução de Questões</h1>

    <div class="cabecalho__lado cabecalho__lado--fim">
      <span class="pontos" id="pontos" data-i18n-attr="title:sua_pontuacao">0 pts</span>
      <div class="conta" id="conta"></div>
      <button type="button" class="botao botao--icone" id="btn-tema"
              data-i18n-attr="aria-label:alternar_tema">☾</button>
    </div>
  </header>

  <main class="conteudo">

    <!-- Tela de entrada: linguagem e depois nível — PRD 3.4 -->
    <section class="escolha" id="tela-escolha">
      <div class="escolha__grupo">
        <h2 class="escolha__titulo" data-i18n="escolha_linguagem">Escolha a linguagem</h2>
        <div class="escolha__botoes" id="botoes-linguagem"></div>
      </div>

      <div class="escolha__grupo" id="grupo-nivel" hidden>
        <h2 class="escolha__titulo" data-i18n="escolha_nivel">Escolha o nível</h2>
        <div class="escolha__botoes" id="botoes-nivel"></div>
      </div>
    </section>

    <!-- Tela de resolução — PRD 3.5 -->
    <section class="resolucao" id="tela-resolucao" hidden>

      <div class="progresso" role="progressbar" aria-valuemin="0" aria-valuemax="100"
           aria-valuenow="0" id="progresso">
        <div class="progresso__barra" id="barra"></div>
      </div>
      <p class="progresso__texto" id="progresso-texto"></p>

      <div class="resolucao__corpo">
        <div class="resolucao__principal">

          <div class="painel">
            <div class="pergunta__topo">
              <h2 class="pergunta__titulo" id="pergunta-titulo"></h2>
              <span class="selo" id="selo-nivel"></span>
            </div>
            <p class="pergunta__texto" id="pergunta-texto"></p>
          </div>

          <div class="painel painel--apoio">
            <h3 class="painel__rotulo" data-i18n="como_responder">Como responder</h3>
            <p id="parametros-texto"></p>
          </div>

          <div class="editor" id="editor-caixa">
            <textarea id="editor-area" spellcheck="false" data-i18n-attr="aria-label:sua_resposta"></textarea>
          </div>

          <div class="acoes">
            <button type="button" class="botao botao--principal" id="btn-enviar"
                    data-i18n="enviar">Enviar resposta</button>
            <button type="button" class="botao botao--pilula" id="btn-pular"
                    data-i18n="pular">Pular questão</button>
            <span class="tentativas" id="tentativas"></span>
          </div>

          <div class="resultado" id="resultado" hidden></div>
        </div>

        <!-- Painel lateral de níveis (desktop) — PRD 3.5b -->
        <aside class="niveis" id="painel-niveis">
          <h3 class="painel__rotulo" data-i18n="niveis">Níveis</h3>
          <div class="niveis__botoes" id="botoes-nivel-lateral"></div>
        </aside>
      </div>
    </section>
  </main>

  <!-- Configurações: os mesmos campos do cadastro, para alterar depois -->
  <div class="modal" id="modal-config" hidden>
    <div class="modal__fundo" id="modal-fundo"></div>
    <div class="modal__caixa" role="dialog" aria-modal="true" aria-labelledby="modal-titulo">
      <h2 class="modal__titulo" id="modal-titulo" data-i18n="configuracoes">Configurações</h2>
      <p class="aviso" id="modal-nota" hidden></p>
      <div class="campos" id="campos-config"></div>
      <p class="aviso aviso--erro" id="modal-mensagem" hidden></p>
      <div class="modal__acoes">
        <button type="button" class="botao botao--pilula" id="btn-config-cancelar"
                data-i18n="cancelar">Cancelar</button>
        <button type="button" class="botao botao--principal" id="btn-config-salvar"
                data-i18n="salvar">Salvar</button>
      </div>
    </div>
  </div>

  <!-- As questões vêm do servidor: o navegador nunca recebe testes nem gabarito -->
  <script src="assets/js/idioma.js"></script>
  <script src="assets/js/catalogo.js"></script>
  <script src="assets/js/perfil.js"></script>

  <script src="assets/js/auth.js"></script>
  <script src="assets/js/storage.js"></script>
  <script src="assets/js/corrector.js"></script>
  <script src="assets/js/editor.js"></script>
  <script src="assets/js/script.js"></script>

  <!-- CodeMirror 6 vem do CDN. Se não carregar (sem internet), a textarea
       continua servindo como editor e a correção segue funcionando. -->
  <script type="module">
    Promise.all([
      import('https://esm.sh/codemirror@6.0.1'),
      import('https://esm.sh/@codemirror/lang-javascript@6.2.2'),
      import('https://esm.sh/@codemirror/theme-one-dark@6.1.2')
    ]).then(function (modulos) {
      Editor.ativarCodeMirror({
        EditorView: modulos[0].EditorView,
        basicSetup: modulos[0].basicSetup,
        javascript: modulos[1].javascript,
        oneDark: modulos[2].oneDark
      });
      App.aoCarregarEditor();
    }).catch(function () {
      App.avisarEditorSimples();
    });
  </script>

</body>
</html>
