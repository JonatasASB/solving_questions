# Deploy no Render. Opcional: dá para configurar tudo pela interface do site
# (docs/deploy.md explica), mas com este arquivo o Render lê a configuração
# pronta em vez de você preencher campo por campo.
services:
  - type: web
    name: solving-questions
    runtime: node
    plan: free
    # O bundle do editor já vem pronto no repositório, então o deploy não
    # precisa das dependências de build (esbuild e CodeMirror).
    buildCommand: npm install --omit=dev
    startCommand: npm start
    envVars:
      # O Render gera o segredo sozinho e o mantém entre deploys — que é o
      # ponto: se ele mudar, todos os logins caem.
      - key: SEGREDO_TOKEN
        generateValue: true
      - key: NODE_VERSION
        value: "22"
      # Onde as contas ficam. Sem estas duas, o servidor cai no arquivo local —
      # que o Render apaga a cada reinício. sync: false quer dizer "pergunte no
      # painel": os valores não entram no repositório, e a chave de serviço do
      # Supabase dá acesso total à tabela.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_CHAVE
        sync: false
